name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Release calls this so a tag is held to the checks a pull request runs, and
  # the two definitions of a passing build cannot drift apart.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    strategy:
      # A failure on one system says nothing about the other, so both run to the end.
      fail-fast: false
      matrix:
        # The Homebrew cask ships the macOS build, so the gate runs there too.
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The SHA pins the action, not the toolchain: pinned by commit, the
      # action no longer reads the toolchain from its own ref, so `with`
      # has to name it.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      # rust-cache keeps ~/.cargo/bin, so this compiles cargo-deny only on a cache miss.
      - run: just tools
      - run: just check
