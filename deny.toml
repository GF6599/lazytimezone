# cargo-deny configuration. Run `cargo install cargo-deny` once, then
# `cargo deny check` locally and in CI.
#
# Three sections matter to us:
# - advisories : RustSec database
# - licenses   : enforce SPDX allow list
# - bans       : duplicate-version detection
# - sources    : restrict registries to crates.io

[graph]
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "warn"
ignore = []

[licenses]
# SPDX identifiers covering every license currently present in
# Cargo.lock. Add more here on a per-incident basis rather than relaxing
# to a glob — every entry should be a deliberate decision.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "OpenSSL",
]
confidence-threshold = 0.8
exceptions = []

[bans]
# `multiple-versions = "warn"` rather than "deny" because tui-big-text
# 0.8 still pulls in `darling` 0.23 while the rest of the graph has
# moved on to 0.20 — there are 13 such duplicate pairs and they're
# outside our control until `tui-big-text` cuts a release that bumps
# `darling`. Re-tighten to "deny" the moment that lands.
multiple-versions = "warn"
wildcards = "allow"
# cargo-deny accepts "simplest-path", "lowest-version" or "all". An
# unrecognised value fails config deserialization, which aborts every
# check in this file rather than just this one.
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
