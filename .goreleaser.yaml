version: 2

before:
  hooks:
    - rustup default stable
    - cargo install --locked cargo-zigbuild

builds:
  - builder: rust
    binary: lazytimezone
    # The crate carries a second binary, gen_cities, which regenerates the
    # city catalogue and has no place in a release archive.
    flags:
      - --release
      - --bin=lazytimezone
    targets:
      - x86_64-apple-darwin
      - aarch64-apple-darwin
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu

archives:
  - formats:
      - tar.gz
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

homebrew_casks:
  - name: lazytimezone
    repository:
      owner: GF6599
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/GF6599/lazytimezone
    description: A terminal world clock browser with search by city, region, or UTC offset
    license: MIT
    # The download domain differs from the homepage, which `brew audit` rejects
    # until the release host is named here.
    url:
      verified: github.com/GF6599/lazytimezone
    # Homebrew quarantines what a cask downloads, and macOS reports a quarantined
    # binary that nobody notarized as damaged rather than running it. Notarizing
    # needs a paid Apple developer account, so the cask clears the attribute.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/lazytimezone"]
          end

changelog:
  sort: asc
  # The history is gitmoji, so the filters drop the doc, test, config and CI
  # commits by their emoji rather than by a conventional-commit prefix.
  filters:
    exclude:
      - "^📝"
      - "^🧪"
      - "^✅"
      - "^🔧"
      - "^👷"
