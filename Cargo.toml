[package]
name = "lazytimezone"
version = "0.8.2"
edition = "2024"
# gen_cities exists as a second binary, so a bare cargo run needs this.
default-run = "lazytimezone"
license = "MIT"
description = "A terminal world clock browser with search by city, region, or UTC offset"

[dependencies]
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
chrono = "0.4"
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
unicode-width = "0.2"
clap = { version = "4.6.6", features = ["derive"] }

[profile.test]
# The scoring loop walks 34k entries per keystroke, and the picker
# tests type whole queries. Unoptimized, the suite takes 40 s.
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
# Tight panic discipline in production paths. Tests opt out per-module
# via `#![allow(clippy::expect_used, ...)]` at the top of their
# `#[cfg(test)] mod tests` block — see e.g. src/app.rs.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
needless_collect = "warn"
or_fun_call = "warn"
redundant_clone = "warn"
